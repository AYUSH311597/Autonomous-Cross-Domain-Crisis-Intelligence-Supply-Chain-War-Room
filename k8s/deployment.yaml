apiVersion: apps/v1
kind: Deployment
metadata:
  name: cascadia-deployment
  labels:
    app: cascadia-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cascadia-app
  template:
    metadata:
      labels:
        app: cascadia-app
    spec:
      containers:
      - name: cascadia-app
        image: ayush311597/cascadia-app:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        resources:
          limits:
            memory: "128Mi"
            cpu: "250m"
          requests:
            memory: "64Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5